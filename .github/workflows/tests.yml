name: Tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test
